<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Portal - GreenLeaf Clinic</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Open Sans', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e8f5e8, #f1f8f1);
      color: #2a3d3f;
      line-height: 1.6;
      min-height: 100vh;
    }

    .header {
      background: #2a6f54;
      color: white;
      padding: 1rem 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: 1.5px;
    }

    .doctor-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .doctor-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #4caf50;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .doctor-greeting {
      color: #a8d5ba;
      font-size: 0.9rem;
    }

    .logout-btn {
      background: transparent;
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.5);
    }

    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .dashboard-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .dashboard-header h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.5rem;
      color: #2a6f54;
      margin-bottom: 0.5rem;
    }

    .dashboard-subtitle {
      color: #666;
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }

    .calendar-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      background: white;
      padding: 1.5rem;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .week-navigation {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-btn {
      background: #4caf50;
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-btn:hover {
      background: #388e3c;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
    }

    .current-week {
      font-size: 1.2rem;
      font-weight: 600;
      color: #2a6f54;
      margin: 0 1rem;
    }

    .today-btn {
      background: #ff9800;
      color: white;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .today-btn:hover {
      background: #f57c00;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
    }

    .stats-overview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: white;
      padding: 1.5rem;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: #4caf50;
      margin-bottom: 0.5rem;
    }

    .stat-label {
      color: #666;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .calendar-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .calendar-header {
      display: grid;
      grid-template-columns: 100px repeat(7, 1fr);
      background: #2a6f54;
      color: white;
    }

    .calendar-cell {
      padding: 1rem;
      text-align: center;
      font-weight: 600;
      border-right: 1px solid rgba(255,255,255,0.2);
    }

    .calendar-cell:last-child {
      border-right: none;
    }

    .day-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .day-name {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .day-date {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .today-marker {
      background: #4caf50;
      color: white;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calendar-body {
      display: grid;
      grid-template-columns: 100px repeat(7, 1fr);
    }

    .time-slot {
      padding: 0.8rem 0.5rem;
      border-right: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      font-size: 0.85rem;
      font-weight: 600;
      color: #666;
      background: #f8f9fa;
      text-align: center;
    }

    .appointment-cell {
      border-right: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      padding: 0.3rem;
      min-height: 60px;
      position: relative;
    }

    .appointment-cell:last-child {
      border-right: none;
    }

    .appointment-block {
      background: linear-gradient(135deg, #4caf50, #66bb6a);
      color: white;
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      font-size: 0.75rem;
      line-height: 1.2;
      margin-bottom: 0.2rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
    }

    .appointment-block:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
    }

    .appointment-patient {
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .appointment-type {
      opacity: 0.9;
      font-size: 0.7rem;
    }

    .appointment-cancelled {
      background: linear-gradient(135deg, #f44336, #ef5350);
      opacity: 0.7;
    }

    .appointment-completed {
      background: linear-gradient(135deg, #9e9e9e, #bdbdbd);
    }

    .no-appointments {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-style: italic;
      height: 100%;
    }

    .appointment-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 20px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      color: #2a6f54;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #999;
      transition: color 0.3s ease;
    }

    .close-btn:hover {
      color: #666;
    }

    .appointment-details {
      display: grid;
      gap: 1rem;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 0.8rem;
      background: #f8f9fa;
      border-radius: 8px;
    }

    .detail-label {
      font-weight: 600;
      color: #2a6f54;
    }

    .detail-value {
      color: #333;
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      margin-top: 2rem;
    }

    .action-btn {
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-complete {
      background: #4caf50;
      color: white;
    }

    .btn-complete:hover {
      background: #388e3c;
      transform: translateY(-1px);
    }

    .btn-cancel {
      background: #f44336;
      color: white;
    }

    .btn-cancel:hover {
      background: #d32f2f;
      transform: translateY(-1px);
    }

    .calendar-sync {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .sync-btn {
      background: #2196f3;
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sync-btn:hover {
      background: #1976d2;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
    }

    .sync-status {
      font-size: 0.85rem;
      color: #4caf50;
      font-weight: 600;
    }

    @media (max-width: 1024px) {
      .calendar-header,
      .calendar-body {
        grid-template-columns: 80px repeat(7, 1fr);
      }
      
      .appointment-block {
        font-size: 0.7rem;
        padding: 0.3rem 0.4rem;
      }
    }

    @media (max-width: 768px) {
      .calendar-controls {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }
      
      .week-navigation {
        flex-direction: column;
        gap: 0.5rem;
      }
      
      .current-week {
        margin: 0;
      }
      
      .calendar-header,
      .calendar-body {
        grid-template-columns: 60px repeat(7, 1fr);
      }
      
      .appointment-block {
        font-size: 0.65rem;
        padding: 0.2rem 0.3rem;
      }
      
      .day-header {
        font-size: 0.8rem;
      }
    }

    @media (max-width: 480px) {
      .stats-overview {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .calendar-header,
      .calendar-body {
        grid-template-columns: 50px repeat(7, 1fr);
        font-size: 0.8rem;
      }
      
      .appointment-block {
        font-size: 0.6rem;
        padding: 0.2rem;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo">GreenLeaf Clinic</div>
      <div class="doctor-info">
        <div class="doctor-avatar" id="doctor-avatar">👨‍⚕️</div>
        <span class="doctor-greeting">Dr. <span id="doctor-name">Loading...</span></span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <div class="main-container">
    <div class="dashboard-header">
      <h1>Doctor's Calendar</h1>
      <p class="dashboard-subtitle">Manage your weekly appointments and schedule</p>
    </div>

    <div class="calendar-controls">
      <div class="week-navigation">
        <button class="nav-btn" onclick="navigateWeek(-1)">
          ← Previous Week
        </button>
        <span class="current-week" id="current-week">Loading...</span>
        <button class="nav-btn" onclick="navigateWeek(1)">
          Next Week →
        </button>
      </div>
      
      <div class="calendar-sync">
        <button class="today-btn" onclick="goToToday()">Today</button>
        <button class="sync-btn" onclick="syncToGoogleCalendar()">
          📅 Sync to Google Calendar
        </button>
        <span class="sync-status" id="sync-status">Ready to sync</span>
      </div>
    </div>

    <div class="stats-overview">
      <div class="stat-card">
        <div class="stat-number" id="total-appointments">0</div>
        <div class="stat-label">Total This Week</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="today-appointments">0</div>
        <div class="stat-label">Today's Appointments</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="pending-appointments">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="completed-appointments">0</div>
        <div class="stat-label">Completed</div>
      </div>
    </div>

    <div class="calendar-container">
      <div class="calendar-header">
        <div class="calendar-cell">Time</div>
        <div class="calendar-cell">
          <div class="day-header">
            <div class="day-name">Mon</div>
            <div class="day-date" id="mon-date">1</div>
          </div>
        </div>
        <div class="calendar-cell">
          <div class="day-header">
            <div class="day-name">Tue</div>
            <div class="day-date" id="tue-date">2</div>
          </div>
        </div>
        <div class="calendar-cell">
          <div class="day-header">
            <div class="day-name">Wed</div>
            <div class="day-date" id="wed-date">3</div>
          </div>
        </div>
        <div class="calendar-cell">
          <div class="day-header">
            <div class="day-name">Thu</div>
            <div class="day-date" id="thu-date">4</div>
          </div>
        </div>
        <div class="calendar-cell">
          <div class="day-header">
            <div class="day-name">Fri</div>
            <div class="day-date" id="fri-date">5</div>
          </div>
        </div>
        <div class="calendar-cell">
          <div class="day-header">
            <div class="day-name">Sat</div>
            <div class="day-date" id="sat-date">6</div>
          </div>
        </div>
        <div class="calendar-cell">
          <div class="day-header">
            <div class="day-name">Sun</div>
            <div class="day-date" id="sun-date">7</div>
          </div>
        </div>
      </div>
      
      <div class="calendar-body" id="calendar-body">
        <!-- Calendar grid will be populated by JavaScript -->
      </div>
    </div>
  </div>

  <!-- Appointment Details Modal -->
  <div class="appointment-modal" id="appointment-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Appointment Details</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      
      <div class="appointment-details" id="appointment-details">
        <!-- Details will be populated by JavaScript -->
      </div>
      
      <div class="modal-actions">
        <button class="action-btn btn-complete" onclick="markAsCompleted()">Mark Completed</button>
        <button class="action-btn btn-cancel" onclick="cancelAppointment()">Cancel Appointment</button>
      </div>
    </div>
  </div>

  <script>
    // Calendar state
    let currentWeekStart = new Date();
    let currentDoctor = null;
    let selectedAppointment = null;
    let appointments = [];

    // Working hours (9 AM to 5 PM)
    const workingHours = [
      '09:00 AM', '09:30 AM', '10:00 AM', '10:30 AM', '11:00 AM', '11:30 AM',
      '12:00 PM', '12:30 PM', '01:00 PM', '01:30 PM', '02:00 PM', '02:30 PM',
      '03:00 PM', '03:30 PM', '04:00 PM', '04:30 PM'
    ];

    // Doctor login simulation (in real app, this would come from authentication)
    const doctors = {
      'dr-jane-smith': { name: 'Jane Smith', avatar: '👩‍⚕️' },
      'dr-michael-lee': { name: 'Michael Lee', avatar: '👨‍⚕️' },
      'dr-sarah-khan': { name: 'Sarah Khan', avatar: '👩‍⚕️' }
    };

    // Initialize the calendar
    document.addEventListener('DOMContentLoaded', function() {
      // Simulate doctor login (in real app, get from session/auth)
      const urlParams = new URLSearchParams(window.location.search);
      const doctorId = urlParams.get('doctor') || 'dr-jane-smith';
      currentDoctor = doctors[doctorId];
      
      if (!currentDoctor) {
        alert('Invalid doctor access. Redirecting to login.');
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('doctor-name').textContent = currentDoctor.name;
      document.getElementById('doctor-avatar').textContent = currentDoctor.avatar;

      // Set current week to start of this week (Monday)
      setWeekStart(new Date());
      
      // Load appointments
      loadAppointments();
      
      // Render calendar
      renderCalendar();
    });

    function setWeekStart(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1); // Adjust when day is Sunday
      currentWeekStart = new Date(d.setDate(diff));
    }

    function loadAppointments() {
      // Load appointments from localStorage (in real app, this would be an API call)
      const allAppointments = JSON.parse(localStorage.getItem('appointments') || '[]');
      
      // Filter appointments for current doctor
      const doctorKey = Object.keys(doctors).find(key => doctors[key].name === currentDoctor.name);
      appointments = allAppointments.filter(apt => apt.doctor === doctorKey);
    }

    function renderCalendar() {
      updateWeekDisplay();
      updateStats();
      generateCalendarGrid();
      populateAppointments();
    }

    function updateWeekDisplay() {
      const endOfWeek = new Date(currentWeekStart);
      endOfWeek.setDate(currentWeekStart.getDate() + 6);
      
      const startStr = currentWeekStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      const endStr = endOfWeek.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      
      document.getElementById('current-week').textContent = `${startStr} - ${endStr}`;

      // Update day headers
      const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
      const today = new Date();
      
      for (let i = 0; i < 7; i++) {
        const dayDate = new Date(currentWeekStart);
        dayDate.setDate(currentWeekStart.getDate() + i);
        
        const dateElement = document.getElementById(`${days[i]}-date`);
        const isToday = dayDate.toDateString() === today.toDateString();
        
        if (isToday) {
          dateElement.innerHTML = `<div class="today-marker">${dayDate.getDate()}</div>`;
        } else {
          dateElement.textContent = dayDate.getDate();
        }
      }
    }

    function updateStats() {
      const weekStart = new Date(currentWeekStart);
      const weekEnd = new Date(currentWeekStart);
      weekEnd.setDate(weekStart.getDate() + 7);
      
      const today = new Date().toDateString();
      
      // Filter appointments for current week
      const weekAppointments = appointments.filter(apt => {
        const aptDate = new Date(apt.date);
        return aptDate >= weekStart && aptDate < weekEnd;
      });
      
      const todayAppointments = weekAppointments.filter(apt => 
        new Date(apt.date).toDateString() === today
      );
      
      const pendingAppointments = weekAppointments.filter(apt => 
        apt.status === 'confirmed' && new Date(apt.date) >= new Date()
      );
      
      const completedAppointments = weekAppointments.filter(apt => 
        apt.status === 'completed'
      );

      document.getElementById('total-appointments').textContent = weekAppointments.length;
      document.getElementById('today-appointments').textContent = todayAppointments.length;
      document.getElementById('pending-appointments').textContent = pendingAppointments.length;
      document.getElementById('completed-appointments').textContent = completedAppointments.length;
    }

    function generateCalendarGrid() {
      const calendarBody = document.getElementById('calendar-body');
      calendarBody.innerHTML = '';

      workingHours.forEach(hour => {
        // Time slot cell
        const timeCell = document.createElement('div');
        timeCell.className = 'time-slot';
        timeCell.textContent = hour;
        calendarBody.appendChild(timeCell);

        // Day cells for this hour
        for (let day = 0; day < 7; day++) {
          const dayCell = document.createElement('div');
          dayCell.className = 'appointment-cell';
          dayCell.dataset.day = day;
          dayCell.dataset.time = hour;
          calendarBody.appendChild(dayCell);
        }
      });
    }

    function populateAppointments() {
      // Clear existing appointments
      document.querySelectorAll('.appointment-block').forEach(block => block.remove());

      appointments.forEach(appointment => {
        const aptDate = new Date(appointment.date);
        const weekStart = new Date(currentWeekStart);
        const weekEnd = new Date(currentWeekStart);
        weekEnd.setDate(weekStart.getDate() + 7);

        // Check if appointment is in current week
        if (aptDate >= weekStart && aptDate < weekEnd) {
          const dayOfWeek = aptDate.getDay();
          const adjustedDay = dayOfWeek === 0 ? 6 : dayOfWeek - 1; // Convert Sunday=0 to Sunday=6
          
          const cell = document.querySelector(`[data-day="${adjustedDay}"][data-time="${appointment.time}"]`);
          
          if (cell) {
            const appointmentBlock = document.createElement('div');
            appointmentBlock.className = 'appointment-block';
            
            if (appointment.status === 'cancelled') {
              appointmentBlock.classList.add('appointment-cancelled');
            } else if (appointment.status === 'completed') {
              appointmentBlock.classList.add('appointment-completed');
            }
            
            appointmentBlock.innerHTML = `
              <div class="appointment-patient">${appointment.patient}</div>
              <div class="appointment-type">${appointment.visitTypeName}</div>
            `;
            
            appointmentBlock.onclick = () => showAppointmentDetails(appointment);
            cell.appendChild(appointmentBlock);
          }
        }
      });
    }

    function showAppointmentDetails(appointment) {
      selectedAppointment = appointment;
      
      const formattedDate = new Date(appointment.date).toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      const detailsContainer = document.getElementById('appointment-details');
      detailsContainer.innerHTML = `
        <div class="detail-row">
          <span class="detail-label">Patient:</span>
          <span class="detail-value">${appointment.patient}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Date:</span>
          <span class="detail-value">${formattedDate}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Time:</span>
          <span class="detail-value">${appointment.time}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Visit Type:</span>
          <span class="detail-value">${appointment.visitTypeName}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Contact Method:</span>
          <span class="detail-value">${appointment.contactMethodName}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Status:</span>
          <span class="detail-value">${appointment.status}</span>
        </div>
        ${appointment.symptoms ? `
          <div class="detail-row">
            <span class="detail-label">Symptoms:</span>
            <span class="detail-value">${appointment.symptoms}</span>
          </div>
        ` : ''}
        <div class="detail-row">
          <span class="detail-label">Appointment ID:</span>
          <span class="detail-value">${appointment.id}</span>
        </div>
      `;

      document.getElementById('appointment-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('appointment-modal').style.display = 'none';
      selectedAppointment = null;
    }

    function markAsCompleted() {
      if (!selectedAppointment) return;

      const allAppointments = JSON.parse(localStorage.getItem('appointments') || '[]');
      const index = allAppointments.findIndex(apt => apt.id === selectedAppointment.id);
      
      if (index !== -1) {
        allAppointments[index].status = 'completed';
        localStorage.setItem('appointments', JSON.stringify(allAppointments));
        
        alert(`Appointment for ${selectedAppointment.patient} marked as completed.`);
        
        // Refresh calendar
        loadAppointments();
        renderCalendar();
        closeModal();
      }
    }

    function cancelAppointment() {
      if (!selectedAppointment) return;
      
      if (confirm(`Are you sure you want to cancel the appointment for ${selectedAppointment.patient}?`)) {
        const allAppointments = JSON.parse(localStorage.getItem('appointments') || '[]');
        const index = allAppointments.findIndex(apt => apt.id === selectedAppointment.id);
        
        if (index !== -1) {
          allAppointments[index].status = 'cancelled';
          localStorage.setItem('appointments', JSON.stringify(allAppointments));
          
          alert(`Appointment for ${selectedAppointment.patient} has been cancelled.`);
          
          // Refresh calendar
          loadAppointments();
          renderCalendar();
          closeModal();
        }
      }
    }

    function navigateWeek(direction) {
      const newWeekStart = new Date(currentWeekStart);
      newWeekStart.setDate(currentWeekStart.getDate() + (direction * 7));
      currentWeekStart = newWeekStart;
      renderCalendar();
    }

    function goToToday() {
      setWeekStart(new Date());
      renderCalendar();
    }

    function syncToGoogleCalendar() {
      // This function would integrate with Google Calendar API
      const syncStatus = document.getElementById('sync-status');
      syncStatus.textContent = 'Syncing...';
      syncStatus.style.color = '#ff9800';
      
      // Simulate API call
      setTimeout(() => {
        // In a real implementation, this would:
        // 1. Authenticate with Google Calendar API
        // 2. Create/update calendar events for appointments
        // 3. Handle conflicts and duplicates
        
        const weekStart = new Date(currentWeekStart);
        const weekEnd = new Date(currentWeekStart);
        weekEnd.setDate(weekStart.getDate() + 7);
        
        const weekAppointments = appointments.filter(apt => {
          const aptDate = new Date(apt.date);
          return aptDate >= weekStart && aptDate < weekEnd && apt.status !== 'cancelled';
        });
        
        // Simulate Google Calendar API integration
        syncToGoogleCalendarAPI(weekAppointments).then(() => {
          syncStatus.textContent = `Synced ${weekAppointments.length} appointments`;
          syncStatus.style.color = '#4caf50';
          
          setTimeout(() => {
            syncStatus.textContent = 'Ready to sync';
            syncStatus.style.color = '#4caf50';
          }, 3000);
        });
      }, 1500);
    }

    async function syncToGoogleCalendarAPI(appointmentsToSync) {
      // This is a placeholder for Google Calendar API integration
      // In a real implementation, you would:
      
      return new Promise((resolve) => {
        console.log('Syncing appointments to Google Calendar:', appointmentsToSync);
        
        appointmentsToSync.forEach(appointment => {
          const event = {
            summary: `Patient: ${appointment.patient}`,
            description: `
              Visit Type: ${appointment.visitTypeName}
              Contact Method: ${appointment.contactMethodName}
              ${appointment.symptoms ? `Symptoms: ${appointment.symptoms}` : ''}
              Appointment ID: ${appointment.id}
            `,
            start: {
              dateTime: convertToGoogleDateTime(appointment.date, appointment.time),
              timeZone: 'America/Toronto'
            },
            end: {
              dateTime: convertToGoogleDateTime(appointment.date, appointment.time, 30), // 30 min duration
              timeZone: 'America/Toronto'
            },
            attendees: [
              {
                email: `${appointment.patient.toLowerCase().replace(' ', '.')}@example.com`,
                displayName: appointment.patient
              }
            ],
            reminders: {
              useDefault: false,
              overrides: [
                { method: 'email', minutes: 24 * 60 }, // 24 hours before
                { method: 'popup', minutes: 30 }       // 30 minutes before
              ]
            }
          };
          
          console.log('Would create Google Calendar event:', event);
        });
        
        // Simulate API delay
        setTimeout(resolve, 1000);
      });
    }

    function convertToGoogleDateTime(date, time, additionalMinutes = 0) {
      // Convert appointment date and time to Google Calendar format
      const [timePart, period] = time.split(' ');
      const [hours, minutes] = timePart.split(':');
      
      let hour24 = parseInt(hours);
      if (period === 'PM' && hour24 !== 12) hour24 += 12;
      if (period === 'AM' && hour24 === 12) hour24 = 0;
      
      const dateTime = new Date(date);
      dateTime.setHours(hour24, parseInt(minutes) + additionalMinutes, 0, 0);
      
      return dateTime.toISOString();
    }

    function logout() {
      if (confirm('Are you sure you want to logout?')) {
        // Clear doctor session
        window.location.href = 'index.html';
      }
    }

    // Close modal when clicking outside
    document.getElementById('appointment-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeModal();
      } else if (e.key === 'ArrowLeft' && e.ctrlKey) {
        navigateWeek(-1);
      } else if (e.key === 'ArrowRight' && e.ctrlKey) {
        navigateWeek(1);
      } else if (e.key === 't' && e.ctrlKey) {
        e.preventDefault();
        goToToday();
      }
    });

    // Auto-refresh appointments every 5 minutes (in case of new bookings)
    setInterval(() => {
      loadAppointments();
      renderCalendar();
    }, 5 * 60 * 1000);
