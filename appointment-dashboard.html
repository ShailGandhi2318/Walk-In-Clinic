<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Appointments - GreenLeaf Clinic</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard-section {
      background: url('images/backgrounds/clinic_bg.jpg') center/cover no-repeat;
      min-height: 85vh;
      padding: 3rem 1rem;
    }

    .dashboard-container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(15px);
      padding: 3rem;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
      opacity: 0;
      animation: fadeInUp 0.8s ease-out forwards;
      border: 1px solid rgba(76, 175, 80, 0.2);
    }

    .dashboard-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .dashboard-header h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.2rem;
      color: #2a6f54;
      margin-bottom: 0.5rem;
    }

    .dashboard-header h2::after {
      content: '';
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #4caf50, #2a6f54);
      display: block;
      margin: 0.5rem auto 0;
      border-radius: 2px;
    }

    .dashboard-subtitle {
      color: #666;
      font-size: 1.1rem;
      font-style: italic;
    }

    .appointment-card {
      background: linear-gradient(135deg, #f8fff8, #e8f5e8);
      border: 2px solid #4caf50;
      border-radius: 15px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.1);
      transition: all 0.3s ease;
    }

    .appointment-card.past {
      background: linear-gradient(135deg, #f5f5f5, #eeeeee);
      border-color: #9e9e9e;
      opacity: 0.8;
    }

    .appointment-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(76, 175, 80, 0.2);
    }

    .appointment-card.past:hover {
      box-shadow: 0 8px 25px rgba(158, 158, 158, 0.2);
    }

    .appointment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .appointment-status {
      background: #4caf50;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .appointment-status.cancelled {
      background: #f44336;
    }

    .appointment-status.completed {
      background: #9e9e9e;
    }

    .appointment-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .detail-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .detail-icon {
      font-size: 1.2rem;
      width: 25px;
      text-align: center;
    }

    .detail-label {
      font-weight: 600;
      color: #2a6f54;
      margin-right: 0.5rem;
    }

    .detail-value {
      color: #2a3d3f;
    }

    .appointment-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .appointment-actions.past {
      justify-content: center;
    }

    .btn-action {
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.9rem;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-reschedule {
      background: #ff9800;
      color: white;
    }

    .btn-reschedule:hover {
      background: #f57c00;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
    }

    .btn-cancel {
      background: #f44336;
      color: white;
    }

    .btn-cancel:hover {
      background: #d32f2f;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(244, 67, 54, 0.3);
    }

    .btn-book-new {
      background: linear-gradient(135deg, #4caf50, #388e3c);
      color: white;
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
      text-decoration: none;
      display: inline-block;
    }

    .btn-book-new:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
    }

    .no-appointments {
      text-align: center;
      padding: 3rem 2rem;
      color: #666;
    }

    .no-appointments-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .no-appointments h3 {
      font-family: 'Montserrat', sans-serif;
      color: #2a6f54;
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }

    .no-appointments p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .symptoms-section {
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 10px;
      border-left: 4px solid #4caf50;
    }

    .symptoms-label {
      font-weight: 600;
      color: #2a6f54;
      margin-bottom: 0.5rem;
      display: block;
    }

    .symptoms-text {
      color: #2a3d3f;
      line-height: 1.5;
      font-style: italic;
    }

    .past-appointment-indicator {
      background: linear-gradient(135deg, #fff3e0, #ffe0b2);
      border: 1px solid #ff9800;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #e65100;
      font-weight: 600;
      text-align: center;
    }

    @media (max-width: 768px) {
      .dashboard-container {
        padding: 2rem 1.5rem;
        margin: 1rem;
      }

      .appointment-header {
        flex-direction: column;
        text-align: center;
      }

      .appointment-details {
        grid-template-columns: 1fr;
      }

      .appointment-actions {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo">GreenLeaf Clinic</div>
      <nav class="nav">
        <div class="nav-links">
          <a href="index.html#about">About</a>
          <a href="index.html#services">Services</a>
          <a href="index.html#doctors">Doctors</a>
          <a href="appointment-dashboard.html" class="book-icon" title="My Appointments" id="header-book-link">📅 My Appointments</a>
        </div>
        <div class="nav-login">
          <span class="user-greeting">Welcome, <span id="user-name">Patient</span>!</span>
          <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
      </nav>
    </div>
  </header>

  <section class="dashboard-section">
    <div class="dashboard-container">
      <div class="dashboard-header">
        <h2 id="dashboard-title">My Appointments</h2>
        <p class="dashboard-subtitle">Manage your upcoming and past appointments</p>
      </div>

      <div id="appointments-container">
        <!-- Appointments will be loaded here by JavaScript -->
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>© 2025 GreenLeaf Clinic. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Reschedule Modal -->
  <div id="reschedule-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 2rem; border-radius: 15px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto;">
      <h3 style="color: #2a6f54; margin-bottom: 1.5rem; font-family: 'Montserrat', sans-serif;">Reschedule Appointment</h3>
      
      <div style="margin-bottom: 1rem;">
        <label for="reschedule-date" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #2a6f54;">New Date:</label>
        <input type="date" id="reschedule-date" style="width: 100%; padding: 0.8rem; border: 2px solid #4caf50; border-radius: 8px;">
      </div>
      
      <div style="margin-bottom: 1.5rem;">
        <label for="reschedule-time" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #2a6f54;">New Time:</label>
        <select id="reschedule-time" style="width: 100%; padding: 0.8rem; border: 2px solid #4caf50; border-radius: 8px;">
          <option value="" disabled selected>Select time slot</option>
          <option value="09:00 AM">09:00 AM</option>
          <option value="09:30 AM">09:30 AM</option>
          <option value="10:00 AM">10:00 AM</option>
          <option value="10:30 AM">10:30 AM</option>
          <option value="11:00 AM">11:00 AM</option>
          <option value="11:30 AM">11:30 AM</option>
          <option value="02:00 PM">02:00 PM</option>
          <option value="02:30 PM">02:30 PM</option>
          <option value="03:00 PM">03:00 PM</option>
          <option value="03:30 PM">03:30 PM</option>
          <option value="04:00 PM">04:00 PM</option>
          <option value="04:30 PM">04:30 PM</option>
        </select>
      </div>
      
      <div style="display: flex; gap: 1rem; justify-content: flex-end;">
        <button onclick="closeRescheduleModal()" style="padding: 0.8rem 1.5rem; background: #ccc; border: none; border-radius: 25px; cursor: pointer;">Cancel</button>
        <button onclick="confirmReschedule()" style="padding: 0.8rem 1.5rem; background: #4caf50; color: white; border: none; border-radius: 25px; cursor: pointer;">Confirm Reschedule</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    let currentRescheduleId = null;

    // Check if user is logged in when page loads
    document.addEventListener('DOMContentLoaded', function() {
      if (!isLoggedIn()) {
        alert('Please log in to view your appointments.');
        window.location.href = 'login.html';
        return;
      }
      
      // Update user name in greeting
      updateLoginState();
      
      // Load appointments
      loadAppointments();
    });

    function loadAppointments() {
      const appointments = getStoredAppointments();
      const container = document.getElementById('appointments-container');
      const dashboardTitle = document.getElementById('dashboard-title');
      const headerBookLink = document.getElementById('header-book-link');
      
      // Check if all appointments are in the past
      const hasUpcomingAppointments = appointments.some(apt => {
        const appointmentDateTime = new Date(apt.date + ' ' + convertTimeTo24Hour(apt.time));
        return appointmentDateTime >= new Date() && apt.status !== 'cancelled';
      });

      // Update header based on appointment status
      if (!hasUpcomingAppointments && appointments.length > 0) {
        dashboardTitle.textContent = 'Book Appointment';
        headerBookLink.innerHTML = '📅 Book';
        headerBookLink.title = 'Book Appointment';
      } else {
        dashboardTitle.textContent = 'My Appointments';
        headerBookLink.innerHTML = '📅 My Appointments';
        headerBookLink.title = 'My Appointments';
      }
      
      if (appointments.length === 0) {
        container.innerHTML = `
          <div class="no-appointments">
            <div class="no-appointments-icon">📅</div>
            <h3>No Appointments Found</h3>
            <p>You don't have any appointments scheduled yet.<br>Book your first appointment with one of our experienced doctors.</p>
            <button class="btn-book-new" onclick="window.location.href='book-appointment.html'">Book New Appointment</button>
          </div>
        `;
      } else {
        // Sort appointments by date (newest first)
        appointments.sort((a, b) => new Date(b.date) - new Date(a.date));
        container.innerHTML = appointments.map(appointment => createAppointmentCard(appointment)).join('');
      }
    }

    function createAppointmentCard(appointment) {
      const appointmentDate = new Date(appointment.date);
      const appointmentDateTime = new Date(appointment.date + ' ' + convertTimeTo24Hour(appointment.time));
      const formattedDate = appointmentDate.toLocaleDateString('en-US', { 
        weekday: 'long', 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
      });

      const isPast = appointmentDateTime < new Date();
      const isUpcoming = !isPast && appointment.status !== 'cancelled';
      const statusClass = appointment.status === 'cancelled' ? 'cancelled' : (isPast ? 'completed' : '');
      const cardClass = isPast ? 'past' : '';
      
      let statusText = appointment.status || 'confirmed';
      if (isPast && appointment.status !== 'cancelled') {
        statusText = 'completed';
      }
      
      return `
        <div class="appointment-card ${cardClass}">
          ${isPast ? '<div class="past-appointment-indicator">📅 Past Appointment</div>' : ''}
          
          <div class="appointment-header">
            <h3 style="color: #2a6f54; margin: 0; font-family: 'Montserrat', sans-serif;">
              Appointment #${appointment.id}
            </h3>
            <span class="appointment-status ${statusClass}">
              ${statusText}
            </span>
          </div>
          
          <div class="appointment-details">
            <div class="detail-item">
              <span class="detail-icon">👨‍⚕️</span>
              <span class="detail-label">Doctor:</span>
              <span class="detail-value">${appointment.doctorName}</span>
            </div>
            <div class="detail-item">
              <span class="detail-icon">📅</span>
              <span class="detail-label">Date:</span>
              <span class="detail-value">${formattedDate}</span>
            </div>
            <div class="detail-item">
              <span class="detail-icon">🕐</span>
              <span class="detail-label">Time:</span>
              <span class="detail-value">${appointment.time}</span>
            </div>
            <div class="detail-item">
              <span class="detail-icon">🏥</span>
              <span class="detail-label">Visit Type:</span>
              <span class="detail-value">${appointment.visitTypeName}</span>
            </div>
            <div class="detail-item">
              <span class="detail-icon">📞</span>
              <span class="detail-label">Contact:</span>
              <span class="detail-value">${appointment.contactMethodName}</span>
            </div>
          </div>
          
          ${appointment.symptoms ? `
            <div class="symptoms-section">
              <span class="symptoms-label">Reason for Visit:</span>
              <p class="symptoms-text">${appointment.symptoms}</p>
            </div>
          ` : ''}
          
          <div class="appointment-actions ${isPast ? 'past' : ''}">
            ${isUpcoming ? `
              <button class="btn-action btn-reschedule" onclick="openRescheduleModal('${appointment.id}')">
                Reschedule
              </button>
              <button class="btn-action btn-cancel" onclick="cancelAppointment('${appointment.id}')">
                Cancel
              </button>
            ` : isPast ? `
              <button class="btn-book-new" onclick="window.location.href='book-appointment.html'">
                Book New Appointment
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    function convertTimeTo24Hour(time12h) {
      const [time, modifier] = time12h.split(' ');
      let [hours, minutes] = time.split(':');
      if (hours === '12') {
        hours = '00';
      }
      if (modifier === 'PM') {
        hours = parseInt(hours, 10) + 12;
      }
      return `${hours}:${minutes}`;
    }

    function openRescheduleModal(appointmentId) {
      currentRescheduleId = appointmentId;
      const modal = document.getElementById('reschedule-modal');
      modal.style.display = 'flex';
      
      // Initialize date restrictions
      const dateInput = document.getElementById('reschedule-date');
      const today = new Date();
      const formattedToday = today.toISOString().split('T')[0];
      dateInput.min = formattedToday;
      
      const maxDate = new Date();
      maxDate.setMonth(maxDate.getMonth() + 3);
      const formattedMaxDate = maxDate.toISOString().split('T')[0];
      dateInput.max = formattedMaxDate;
    }

    function closeRescheduleModal() {
      const modal = document.getElementById('reschedule-modal');
      modal.style.display = 'none';
      currentRescheduleId = null;
      document.getElementById('reschedule-date').value = '';
      document.getElementById('reschedule-time').value = '';
    }

    function confirmReschedule() {
      const newDate = document.getElementById('reschedule-date').value;
      const newTime = document.getElementById('reschedule-time').value;
      
      if (!newDate || !newTime) {
        alert('Please select both date and time for rescheduling.');
        return;
      }
      
      // Check if selected date is weekday
      const selectedDate = new Date(newDate);
      const dayOfWeek = selectedDate.getDay();
      if (dayOfWeek === 0 || dayOfWeek === 6) {
        alert('Appointments are only available Monday through Friday. Please select a weekday.');
        return;
      }
      
      // Check for conflicts with existing appointments
      if (hasAppointmentConflict(newDate, newTime, currentRescheduleId)) {
        alert('You already have an appointment at this date and time. Please choose a different slot.');
        return;
      }
      
      // Update the appointment
      const appointments = getStoredAppointments();
      const appointmentIndex = appointments.findIndex(apt => apt.id === currentRescheduleId);
      
      if (appointmentIndex !== -1) {
        appointments[appointmentIndex].date = newDate;
        appointments[appointmentIndex].time = newTime;
        appointments[appointmentIndex].timestamp = new Date().toISOString();
        
        localStorage.setItem('appointments', JSON.stringify(appointments));
        
        const formattedDate = new Date(newDate).toLocaleDateString('en-US', { 
          weekday: 'long', 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric' 
        });
        
        alert(`Appointment rescheduled successfully! 🎉\n\nNew Date: ${formattedDate}\nNew Time: ${newTime}\n\nWe will contact you to confirm the new appointment time.`);
        
        closeRescheduleModal();
        loadAppointments();
      }
    }

    function cancelAppointment(appointmentId) {
      if (confirm('Are you sure you want to cancel this appointment? This action cannot be undone.')) {
        const appointments = getStoredAppointments();
        const appointmentIndex = appointments.findIndex(apt => apt.id === appointmentId);
        
        if (appointmentIndex !== -1) {
          appointments[appointmentIndex].status = 'cancelled';
          appointments[appointmentIndex].timestamp = new Date().toISOString();
          
          localStorage.setItem('appointments', JSON.stringify(appointments));
          
          alert('Appointment cancelled successfully. We\'re sorry to see you go. You can book a new appointment anytime.');
          loadAppointments();
        }
      }
    }

    function hasAppointmentConflict(date, time, excludeId = null) {
      const appointments = getStoredAppointments();
      return appointments.some(apt => 
        apt.id !== excludeId && 
        apt.status !== 'cancelled' && 
        apt.date === date && 
        apt.time === time
      );
    }

    function getStoredAppointments() {
      const currentUser = getUserName();
      const allAppointments = JSON.parse(localStorage.getItem('appointments') || '[]');
      return allAppointments.filter(apt => apt.patient === currentUser);
    }

    // Close modal when clicking outside
    document.getElementById('reschedule-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeRescheduleModal();
      }
    });
  </script>
</body>
</html>
